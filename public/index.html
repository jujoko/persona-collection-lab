<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>페르소나 궤적</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <section class="workspace">
      <header class="topbar">
        <div>
          <h1>페르소나 궤적</h1>
        </div>
        <div class="topbar-actions">
          <button id="loadSampleBtn" type="button">샘플 불러오기</button>
          <button id="resetBtn" type="button">초기화</button>
          <button id="exportBtn" type="button">JSON 내보내기</button>
        </div>
      </header>

      <nav class="mode-tabs" aria-label="화면 전환">
        <div class="mode-tab-group">
          <button class="mode-tab active" type="button" data-view-target="userView">플레이</button>
          <button class="mode-tab" type="button" data-view-target="endingGalleryView">엔딩 도감</button>
        </div>
        <button class="mode-tab admin-mode-tab" type="button" data-view-target="adminView">연구 로그</button>
      </nav>

      <section id="userView" class="view-section active">
        <section class="main-grid user-grid">
          <form id="characterForm" class="panel creation-panel">
            <div class="panel-head">
              <div>
                <h2>캐릭터 만들기</h2>
              </div>
              <span class="counter" id="characterCount">0명</span>
            </div>

            <label>
              캐릭터 이름
              <input id="nameInput" name="characterName" type="text" maxlength="10" pattern="[가-힣A-Za-z0-9]{1,10}" placeholder="비워두면 무작위 이름을 사용합니다">
            </label>

            <label>
              페르소나 설명
              <textarea id="promptInput" name="prompt" rows="9">서울 변두리의 조용한 가정에서 자랐다. 부모의 기대가 컸고, 어린 시절에는 실패하면 사랑받지 못할까 봐 불안해했다. 지금은 안정적인 삶을 원하지만 부당한 일을 보면 쉽게 외면하지 못한다.</textarea>
            </label>

            <div class="prompt-guide">
              <strong>넣으면 좋은 것</strong>
              <span>가정환경</span>
              <span>어릴 때의 경험</span>
              <span>원하는 것</span>
              <span>두려워하는 것</span>
              <span>사회에서의 태도</span>
            </div>

            <button id="submitBtn" class="primary-action" type="submit">캐릭터 생성</button>
          </form>

          <section class="panel results-panel" hidden>
            <div class="panel-head">
              <div>
                <p class="eyebrow">Story Flow</p>
                <h2>출생 배경과 현재 사건</h2>
              </div>
              <div class="result-controls">
                <button id="compareBtn" type="button">최근 캐릭터 비교</button>
              </div>
            </div>
            <div id="emptyState" class="empty-state">
              캐릭터를 만들면 출생 배경과 첫 사건이 여기에 나타납니다.
            </div>
            <div id="resultList" class="result-list"></div>
          </section>
        </section>
      </section>

      <section id="endingGalleryView" class="view-section" hidden>
        <div class="gallery-shell">
          <div class="gallery-header">
            <div>
              <p class="eyebrow">Ending Gallery</p>
              <h2>엔딩 도감</h2>
              <p id="galleryProgress" class="gallery-progress-text"></p>
            </div>
          </div>
          <div id="endingGalleryGrid" class="ending-gallery-grid"></div>
        </div>
      </section>

      <section id="adminView" class="view-section admin-grid" hidden>
        <aside class="panel persona-panel">
          <div class="panel-head">
            <div>
              <p class="eyebrow">Latent Persona Space</p>
              <h2>잠재 페르소나 구조</h2>
            </div>
            <span class="pill" id="activeCharacterBadge">대기 중</span>
          </div>
          <canvas id="networkCanvas" width="420" height="260"></canvas>
          <div id="traitBars" class="trait-bars"></div>
        </aside>

        <section class="panel model-panel">
          <div class="panel-head">
            <div>
              <p class="eyebrow">Model Stack</p>
              <h2>모델 계층</h2>
            </div>
          </div>
          <div id="adminModelPanel" class="admin-model-panel"></div>
        </section>

        <section class="panel dataset-panel">
          <div class="panel-head">
            <div>
              <p class="eyebrow">Dataset Builder</p>
              <h2>수집 로그</h2>
            </div>
            <span class="counter" id="logCount">0건</span>
          </div>
          <pre id="datasetPreview">{}</pre>
        </section>
      </section>
    </section>
  </main>

  <script src="/content/flags.js"></script>
  <script src="/content/arc0_elementary.js"></script>
  <script src="/content/arc1_middle.js"></script>
  <script src="/content/arc2_highschool.js"></script>
  <script src="/content/arc2_5_repeat.js"></script>
  <script src="/content/arc3_university.js"></script>
  <script src="/content/arc4_job_hunt.js"></script>
  <script src="/content/arc5_early_career.js"></script>
  <script src="/content/arc6_thirties.js"></script>
  <script src="/content/arc7_midlife.js"></script>
  <script src="/content/allArcs.js"></script>
  <script src="/content/adapter.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
