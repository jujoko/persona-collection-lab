name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install tqdm

      - name: Run tests
        run: |
          npm test
          python -m unittest discover -s test -p "test_*.py" -v

      - name: Validate syntax and dependencies
        run: |
          node --check src/server.mjs
          node --check src/db.mjs
          python -m py_compile ml/inference_server.py ml/train_play_model.py ml/sample_dataset.py ml/benchmark_play_model.py
          bash -n start.sh
          npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build deployment image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: persona-collection-lab:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
