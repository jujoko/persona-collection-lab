name: Sync to HF Space

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify release
        run: |
          npm ci
          python -m pip install tqdm
          npm test
          python -m unittest discover -s test -p "test_*.py" -v
          npm audit --omit=dev --audit-level=high

  sync:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          SPACE_DIR="$RUNNER_TEMP/persona-collection-lab-space"
          mkdir -p "$SPACE_DIR"
          rsync -a --delete \
            --exclude=".git/" \
            --exclude=".venv/" \
            --exclude="node_modules/" \
            --exclude="outputs/" \
            ./ "$SPACE_DIR/"

          cd "$SPACE_DIR"
          git init -b main
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add .
          git commit -m "Sync Space from ${GITHUB_SHA}"
          git remote add hf https://jujoko:$HF_TOKEN@huggingface.co/spaces/jujoko/persona-collection-lab
          for attempt in 1 2 3 4 5; do
            if git push hf main --force; then
              exit 0
            fi
            sleep_seconds=$((attempt * 30))
            echo "HF push failed on attempt ${attempt}; retrying in ${sleep_seconds}s."
            sleep "$sleep_seconds"
          done
          git push hf main --force
